<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Our Resource Library | Eleczo</title>

<meta name="description"
content="Browse Eleczo's complete collection of electrical products, wiring devices, cables, wires, lighting, fans, industrial products and brand landing pages.">

<link rel="icon" href="https://electrolix.github.io/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="https://electrolix.github.io/images/favicon.png">
<link rel="apple-touch-icon" href="https://electrolix.github.io/images/apple-touch-icon.png"> 

<link rel="stylesheet" href="css/style.css">  
<link rel="stylesheet" href="css/back-to-top.css">  


</head>
<body>
<div id="header"></div>

  
<section class="library-hero">

    <div class="container">

        <div class="library-content">

            <span class="library-badge">Eleczo Resource Library</span>

            <h1>Explore Our Resource Library</h1>

            <p>
                Browse all Eleczo landing pages organised by electrical product categories and brands. Quickly search products, switches, sockets, cables, wires, lighting, fans and more.
            </p>

            <div class="search-area">

                <input
                    type="text"
                    class="search-box"
                    id="search"
                    placeholder="Search products & brands...">

                <select id="filter">

                    <option value="all">All Categories</option>

                    <option>Cover Plates</option>
                    <option>Module Boxes</option>
                    <option>Metal Boxes</option>
                    <option>Switches</option>
                    <option>Sockets</option>
                    <option>Wires</option>
                    <option>Cables</option>
                    <option>Fans</option>
                    <option>Lighting</option>
                    <option>Network Cables</option>
                    <option>Testing Instruments</option>

                    <option>Anchor</option>
                    <option>Finolex</option>
                    <option>Goldmedal</option>
                    <option>GM</option>
                    <option>Legrand</option>
                    <option>Schneider Electric</option>
                    <option>Havells</option>
                    <option>LAPP</option>

                </select>

            </div>

        </div>

    </div>

</section>




  <div id="footer"></div>


<script src="js/script.js"></script> 
<script src="js/back-to-top.js"></script>
    

</body>

</html>
