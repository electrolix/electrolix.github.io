<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Articles | Electrolix</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f6f8fc;
    color:#172033;
}

/* =========================
   HERO
========================= */

.articles-hero{
    background:
        radial-gradient(circle at top left, rgba(59,130,246,.22), transparent 35%),
        linear-gradient(135deg,#0b1530,#14265a);
    color:#fff;
    padding:100px 20px 130px;
    text-align:center;
}

.hero-inner{
    max-width:850px;
    margin:auto;
}

.hero-tag{
    display:inline-block;
    padding:9px 16px;
    margin-bottom:22px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.08);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
}

.articles-hero h1{
    font-size:clamp(42px,6vw,72px);
    line-height:1.1;
    margin-bottom:20px;
}

.articles-hero p{
    max-width:650px;
    margin:auto;
    color:#cbd5e1;
    font-size:17px;
    line-height:1.8;
}

/* =========================
   MAIN
========================= */

.articles-container{
    max-width:1280px;
    margin:-55px auto 0;
    padding:0 20px 100px;
    position:relative;
}

/* =========================
   SEARCH
========================= */

.search-box{
    max-width:750px;
    margin:0 auto 70px;
    background:#fff;
    padding:10px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(15,23,42,.15);
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    padding:18px 20px;
    font-size:16px;
    background:#f8fafc;
    border-radius:12px;
}

.search-box input:focus{
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* =========================
   TOP INFO
========================= */

.articles-top{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:35px;
}

.articles-top h2{
    font-size:30px;
    margin-bottom:8px;
}

.articles-top p{
    color:#64748b;
}

#articleCount{
    white-space:nowrap;
}

/* =========================
   GRID
========================= */

.articles-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
}

/* =========================
   CARD
========================= */

.article-card{
    background:#fff;
    border:1px solid #e7edf5;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:.3s ease;
    box-shadow:0 5px 20px rgba(15,23,42,.04);
}

.article-card:hover{
    transform:translateY(-7px);
    box-shadow:0 22px 50px rgba(15,23,42,.13);
}

.article-image{
    display:block;
    height:220px;
    overflow:hidden;
    background:linear-gradient(135deg,#dbeafe,#e0e7ff);
}

.article-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
}

.article-card:hover .article-image img{
    transform:scale(1.06);
}

.article-content{
    padding:24px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.article-date{
    font-size:12px;
    color:#64748b;
    margin-bottom:14px;
}

.article-title{
    font-size:21px;
    line-height:1.4;
    margin-bottom:13px;
    color:#172033;
}

.article-description{
    font-size:14px;
    line-height:1.75;
    color:#64748b;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.article-link{
    margin-top:auto;
    padding-top:25px;
    text-decoration:none;
    color:#2563eb;
    font-weight:700;
    font-size:14px;
}

.article-link:hover{
    text-decoration:underline;
}

/* =========================
   LOADING / EMPTY
========================= */

.message{
    grid-column:1/-1;
    background:#fff;
    padding:70px 20px;
    text-align:center;
    border-radius:20px;
    color:#64748b;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .articles-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .articles-hero{
        padding:80px 20px 110px;
    }

    .articles-container{
        padding:0 15px 70px;
    }

    .articles-grid{
        grid-template-columns:1fr;
    }

    .articles-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .article-image{
        height:230px;
    }

}

</style>
</head>

<body>


<!-- HERO -->

<section class="articles-hero">

    <div class="hero-inner">

        <div class="hero-tag">
            ELECTROLIX KNOWLEDGE HUB
        </div>

        <h1>
            Explore Our Latest Electrical Guides
        </h1>

        <p>
            Practical guides, wire specifications, buying insights
            and useful electrical knowledge — all in one place.
        </p>

    </div>

</section>


<!-- CONTENT -->

<main class="articles-container">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="search"
            id="articleSearch"
            placeholder="Search articles..."
            autocomplete="off"
        >

    </div>


    <!-- TITLE -->

    <div class="articles-top">

        <div>

            <h2>All Articles</h2>

            <p id="resultsText">
                Loading articles...
            </p>

        </div>

        <p id="articleCount"></p>

    </div>


    <!-- BLOG GRID -->

    <section
        class="articles-grid"
        id="articlesGrid"
    >

        <div class="message">
            Loading articles...
        </div>

    </section>


</main>


<script>

/* ========================================
   ADD ONLY BLOG LINKS HERE
======================================== */

const blogLinks = [

    "https://electrolix.github.io/finolex-90-mtr-wires-buying-guide.html",

    "https://electrolix.github.io/finolex-copper-wires-guide.html",

    "https://electrolix.github.io/finolex-frlsh-wires-explained.html",

    "https://electrolix.github.io/finolex-frls-wires-features-uses.html",

    "https://electrolix.github.io/finolex-fr-wires-features-sizes-uses.html",

    "https://electrolix.github.io/finolex-4-sq-mm-wire-uses-specifications.html",

    "https://electrolix.github.io/finolex-6-sq-mm-wire-guide.html",

    "https://electrolix.github.io/understanding-finolex-1-5-sq-mm-wire.html",

    "https://electrolix.github.io/finolex-1-sq-mm-wire-details.html",

    "https://electrolix.github.io/finolex-wires-for-lighting-guide.html",

    "https://electrolix.github.io/finolex-0-75-mm-wire-complete-guide.html",

];


/* ========================================
   VARIABLES
======================================== */

let allArticles = [];


/* ========================================
   GET META DATA
======================================== */

function getMeta(doc, selector){

    const element = doc.querySelector(selector);

    if(element){
        return element.getAttribute("content") || "";
    }

    return "";

}


/* ========================================
   GET ARTICLE DATE
======================================== */

function getDate(doc){

    const jsonScripts = doc.querySelectorAll(
        'script[type="application/ld+json"]'
    );

    for(const script of jsonScripts){

        try{

            const data = JSON.parse(script.textContent);

            const items = data["@graph"]
                ? data["@graph"]
                : [data];

            for(const item of items){

                if(item.datePublished){
                    return item.datePublished;
                }

            }

        }catch(error){

            // Ignore invalid JSON-LD

        }

    }

    return "";

}


/* ========================================
   FORMAT DATE
======================================== */

function formatDate(date){

    if(!date) return "";

    const parsedDate = new Date(date);

    if(isNaN(parsedDate)) return "";

    return parsedDate.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* ========================================
   GET HERO RIGHT IMAGE
======================================== */

function getHeroImage(doc){

    const image = doc.querySelector(
        ".hero-right img"
    );

    if(!image){
        return "";
    }

    let imageUrl = image.getAttribute("src");

    if(!imageUrl){
        return "";
    }

    /*
       Convert relative image URLs into
       absolute URLs based on the article URL.
    */

    try{

        return new URL(
            imageUrl,
            doc.baseURI
        ).href;

    }catch(error){

        return imageUrl;

    }

}


/* ========================================
   FETCH ONE ARTICLE
======================================== */

async function fetchArticle(url){

    try{

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Could not load article");
        }

        const html = await response.text();

        const parser = new DOMParser();

        const doc = parser.parseFromString(
            html,
            "text/html"
        );


        /* =========================
           TITLE
        ========================= */

        const title =

            getMeta(
                doc,
                'meta[property="og:title"]'
            )

            ||

            doc.querySelector("h1")
                ?.textContent

            ||

            doc.querySelector("title")
                ?.textContent

            ||

            "Electrolix Article";


        /* =========================
           DESCRIPTION
        ========================= */

        const description =

            getMeta(
                doc,
                'meta[property="og:description"]'
            )

            ||

            getMeta(
                doc,
                'meta[name="description"]'
            )

            ||

            "";


        /* =========================
           IMAGE

           IMPORTANT:
           DO NOT USE OG IMAGE.

           The image is taken directly
           from:

           .hero-right img
        ========================= */

        const image = getHeroImage(doc);


        /* =========================
           RETURN ARTICLE
        ========================= */

        return {

            title: title.trim(),

            description: description.trim(),

            image: image,

            date: getDate(doc),

            url: url

        };

    }

    catch(error){

        console.error(
            "Failed to load:",
            url,
            error
        );

        return null;

    }

}


/* ========================================
   LOAD ALL BLOGS
======================================== */

async function loadArticles(){

    const requests = blogLinks.map(
        url => fetchArticle(url)
    );

    const results = await Promise.all(requests);

    allArticles = results.filter(
        article => article !== null
    );


    document.getElementById(
        "articleCount"
    ).textContent =
        allArticles.length + " Articles";


    renderArticles();

}


/* ========================================
   RENDER BLOGS
======================================== */

function renderArticles(){

    const grid = document.getElementById(
        "articlesGrid"
    );


    const searchValue = document
        .getElementById("articleSearch")
        .value
        .toLowerCase()
        .trim();


    const filteredArticles = allArticles.filter(
        article => {

            return (

                article.title
                    .toLowerCase()
                    .includes(searchValue)

                ||

                article.description
                    .toLowerCase()
                    .includes(searchValue)

            );

        }
    );


    document.getElementById(
        "resultsText"
    ).textContent =
        filteredArticles.length +
        (
            filteredArticles.length === 1
                ? " article found"
                : " articles found"
        );


    /* =========================
       NO RESULTS
    ========================= */

    if(filteredArticles.length === 0){

        grid.innerHTML = `

            <div class="message">

                <h3>No articles found</h3>

                <br>

                <p>
                    Try searching with another keyword.
                </p>

            </div>

        `;

        return;

    }


    /* =========================
       ARTICLE CARDS
    ========================= */

    grid.innerHTML = filteredArticles.map(
        article => `

        <article class="article-card">


            <a
                href="${article.url}"
                class="article-image"
            >

                ${
                    article.image

                    ?

                    `<img
                        src="${escapeHtml(article.image)}"
                        alt="${escapeHtml(article.title)}"
                        loading="lazy"
                    >`

                    :

                    ""

                }

            </a>


            <div class="article-content">


                ${
                    article.date

                    ?

                    `<div class="article-date">
                        ${formatDate(article.date)}
                    </div>`

                    :

                    ""

                }


                <h2 class="article-title">
                    ${escapeHtml(article.title)}
                </h2>


                <p class="article-description">
                    ${escapeHtml(article.description)}
                </p>


                <a
                    href="${article.url}"
                    class="article-link"
                >
                    Read Article →
                </a>


            </div>


        </article>

    `
    ).join("");

}


/* ========================================
   PREVENT HTML ISSUES
======================================== */

function escapeHtml(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ========================================
   WORKING SEARCH
======================================== */

document
    .getElementById("articleSearch")
    .addEventListener(
        "input",
        renderArticles
    );


/* ========================================
   START
======================================== */

loadArticles();

</script>

</body>
</html>
