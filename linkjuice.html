<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Electrical Products & Buying Guides | Eleczo Resources</title>

<meta name="description"
content="Browse electrical products, buying guides and categories. Find cables, switches, sockets, fans and more, then visit the corresponding Eleczo landing page.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#f7f9fc;
color:#1e293b;
}

a{
text-decoration:none;
color:inherit;
}

.container{
width:min(1280px,92%);
margin:auto;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
padding:90px 0;
color:#fff;
text-align:center;
}

header h1{
font-size:46px;
font-weight:800;
margin-bottom:18px;
}

header p{
max-width:760px;
margin:auto;
line-height:1.7;
opacity:.9;
}

.search-box{
margin-top:35px;
}

.search-box input{
width:min(650px,95%);
padding:18px 22px;
border:none;
border-radius:50px;
font-size:16px;
outline:none;
}

section{
padding:60px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:28px;
}

.card{
background:#fff;
border-radius:18px;
padding:28px;
transition:.35s;
box-shadow:0 10px 30px rgba(0,0,0,.06);
border:1px solid #edf2f7;
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 18px 40px rgba(37,99,235,.15);
}

.icon{
width:58px;
height:58px;
background:#eff6ff;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-bottom:20px;
}

.badge{
display:inline-block;
background:#dbeafe;
color:#1d4ed8;
padding:7px 14px;
border-radius:30px;
font-size:13px;
font-weight:600;
margin-bottom:16px;
}

.card h3{
font-size:22px;
margin-bottom:12px;
}

.card p{
color:#64748b;
line-height:1.7;
margin-bottom:22px;
flex:1;
}

.btn{
display:inline-block;
background:#2563eb;
color:#fff;
padding:13px 22px;
border-radius:10px;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:#1d4ed8;
}

footer{
padding:40px;
text-align:center;
color:#64748b;
}

@media(max-width:768px){

header{
padding:70px 0;
}

header h1{
font-size:34px;
}

}

</style>

</head>

<body>

<header>

<div class="container">

<h1>Electrical Products & Buying Resources</h1>

<p>
Discover electrical products, guides and categories in one organised place.
Search quickly and visit the corresponding Eleczo landing page.
</p>

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search cables, switches, sockets, fans...">

</div>

</div>

</header>

<section>

<div class="container">

<div class="grid" id="cards">

    </div>
</div>
</section>

<footer>

© 2026 Eleczo Resources. All rights reserved.

</footer>

<script>

const search=document.getElementById("search");

search.addEventListener("keyup",function(){

let value=this.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

card.style.display=card.innerText.toLowerCase().includes(value)
? "flex"
: "none";

});

});

</script>

</body>
</html>
